<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연극·뮤지컬 아카이브 '오리'</title>
<meta property="og:title" content="연극·뮤지컬 아카이브 '오리'">
<meta property="og:description" content="프로와 아마추어를 가리지 않는 연극·뮤지컬 공연 기록. 사람·극장·작품으로 이어지는 이력을 찾아보고, 내 공연의 기획부터 라이선스·제작·운영까지 한 곳에서.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nussleman.github.io/ori/gongyon-db.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="연극·뮤지컬 아카이브 '오리'">
<meta name="twitter:description" content="프로와 아마추어를 가리지 않는 연극·뮤지컬 공연 기록. 사람·극장·작품으로 이어지는 이력을 찾아보고, 내 공연의 기획부터 라이선스·제작·운영까지 한 곳에서.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap">
<link rel="stylesheet" href="assets/css/site.css?v=20260928e">
</head>
<body>

<header></header>

<!-- 로그인 게이트: 로그인 안 하면 이것만 보이고 나머지는 렌더링 자체를 안 함 -->
<div class="auth-gate" id="auth-gate">
  <svg class="logo-mark" viewBox="0 0 120 100"><use href="#duck-logo"></use></svg>
  <div class="auth-gate-title">오리</div>
  <div class="auth-gate-sub">이 안의 이야기를 보려면<br>구글 계정으로 먼저 들어와야 해요.</div>
  <button class="auth-gate-btn" onclick="loginWithGoogle()">구글로 로그인</button>
</div>

<!-- 선언 의식: 로그인 직후, 진짜 입장하기 전에 한 번 거치는 화면 -->
<div class="oath-gate" id="oath-gate">
  <div class="oath-box">
    <div class="oath-text" id="oath-text"></div>
    <div class="oath-input-wrap" id="oath-input-wrap">
      <button class="oath-confirm-btn" onclick="confirmOath()">선언합니다!</button>
    </div>
  </div>
</div>

<!-- 재사용되는 오리 로고 마크 (심볼로 한 번만 정의) -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="duck-logo" viewBox="0 0 120 100">
    <ellipse cx="52" cy="68" rx="38" ry="25" fill="var(--accent)"/>
    <circle cx="78" cy="40" r="20" fill="var(--accent)"/>
    <path d="M94,34 Q118,28 119,38 Q118,48 94,44 Z" fill="var(--accent)"/>
    <circle cx="84" cy="34" r="3.2" fill="var(--bg)"/>
  </symbol>
</svg>

<div class="page-wrap">
  <!-- 좌측 메뉴: 모드(둘러보기 / 내 공연)에 따라 둘 중 하나만 보인다 (body.mode-my) -->
  <nav class="left-nav">
    <nav id="main-nav" class="nav-browse" aria-label="둘러보기">
      <button id="nav-home" onclick="goHome()">홈</button>
      <button id="nav-shows" onclick="goShows()">공연</button>
      <button id="nav-works" onclick="goWorks()">작품</button>
      <button id="nav-people" onclick="goPeople()">사람</button>
      <button id="nav-troupes" onclick="goTroupes()">단체</button>
      <button id="nav-venues" onclick="goVenues()">극장</button>
      <button id="nav-roles" onclick="goRoles()">배역</button>
      <div class="nav-divider"></div>
      <button id="nav-projects" onclick="goProjectBrowse()">모집 중인 자리</button>
      <button id="nav-dashboard" onclick="goDashboard()">통계</button>
    </nav>
    <nav id="my-nav" class="nav-my" aria-label="내 공연">
      <button id="nav-my" onclick="goMyShows()">내 공연 전체</button>
      <div class="nav-section-label">진행 중</div>
      <div id="my-nav-projects"></div>
      <button class="nav-new" onclick="startNewProject()">+ 새 공연 시작</button>
    </nav>
    <div class="sidebar-credit">오리는 team 오리가 만들고 있어요<br><a href="#terms" onclick="goTerms();return false;">이용약관</a> · <a href="#privacy" onclick="goPrivacy();return false;">개인정보처리방침</a></div>
  </nav>

  <div class="content-area">
    <div class="top-bar" id="top-bar">
      <div class="top-bar-title" onclick="goHome()"><svg class="logo-mark"><use href="#duck-logo"></use></svg>오리</div>
      <div class="mode-switch" role="tablist" aria-label="모드">
        <button id="mode-browse" role="tab" onclick="goHome()">둘러보기</button>
        <button id="mode-my" role="tab" onclick="goMyShows()">내 공연</button>
      </div>
      <div class="global-search" id="gs-wrap">
        <span class="gs-icon">🔍</span>
        <input id="gs-input" type="text" placeholder="검색…" autocomplete="off"
          oninput="gsInput()" onkeydown="gsKeydown(event)" onfocus="gsOpen()">
        <button class="gs-clear" id="gs-clear" onclick="gsClear()">✕</button>
        <div class="gs-dropdown" id="gs-dropdown"></div>
      </div>
    </div>
    <main id="mn"></main>
  </div>

  <div id="sb" style="display:none"></div>

  <!-- 미리보기 패널: 카드를 한 번 클릭하면 여기 뜨고, 두 번 클릭하면 전용 페이지로 간다 (assets/js/site/peek.js) -->
  <aside class="peek" id="peek" aria-hidden="true" aria-label="미리보기">
    <div class="peek-bar">
      <button class="peek-icon-btn" id="peek-back" onclick="peekBack()" title="이전" hidden>←</button>
      <span class="peek-type" id="peek-type"></span>
      <button class="peek-expand" onclick="expandPeek()" title="전용 페이지로 열기 (카드를 두 번 클릭해도 돼요)">페이지로 열기 ↗</button>
      <button class="peek-icon-btn" onclick="closePeek()" title="닫기 (Esc)">✕</button>
    </div>
    <div class="peek-body" id="peek-body"></div>
  </aside>
</div>

<button class="profile-fab" id="profile-fab" onclick="handleProfileFabClick()" title="로그인">👤</button>
<div class="profile-dropdown" id="profile-dropdown">
  <button class="profile-dropdown-item" onclick="closeProfileDropdown();goMyPageTab('info')">👤 내 정보</button>
  <button class="profile-dropdown-item" onclick="closeProfileDropdown();goMyPageTab('troupes')">🏢 내 단체</button>
  <button class="profile-dropdown-item" onclick="closeProfileDropdown();goMyShows()">🎪 내 공연</button>
  <div class="profile-dropdown-divider"></div>
  <button class="profile-dropdown-item" onclick="closeProfileDropdown();goMyPageTab('dashboard')">📊 마이페이지 전체 보기</button>
  <div class="profile-dropdown-divider"></div>
  <button class="profile-dropdown-item" onclick="closeProfileDropdown();logout()">↩ 로그아웃</button>
</div>

<div class="lightbox-overlay" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="">
</div>

<button class="report-fab" onclick="openEditModal()" title="정보 제보 / 수정 요청"><span>✎</span><span>정보 제보</span></button>

<div class="edit-modal-overlay" id="edit-modal-overlay" onclick="if(event.target===this)closeEditModal()">
  <div class="edit-modal">
    <div class="edit-modal-title">정보 제보 · 수정 요청</div>
    <div class="edit-modal-sub">잘못된 정보를 봤거나, 새로 추가하고 싶은 게 있으면 알려주세요. 관리자가 확인 후 반영해요.</div>
    <div class="edit-modal-field">
      <label>무엇에 대한 건가요?</label>
      <select id="edit-target-type" onchange="onEditTargetTypeChange()">
        <option value="show">공연</option>
        <option value="work">작품</option>
        <option value="troupe">단체</option>
        <option value="venue">극장</option>
        <option value="person">사람</option>
        <option value="role">배역</option>
        <option value="other">기타 / 새로운 항목 추가</option>
      </select>
    </div>
    <div class="edit-modal-field" id="edit-target-picker-field">
      <label>어떤 항목인가요?</label>
      <input type="text" class="wizard-search" id="edit-target-search" style="margin-bottom:0.4rem" placeholder="이름으로 검색..." oninput="editModalFilterList(this.value)">
      <div id="edit-target-selected" style="font-size:0.8rem;color:var(--accent);margin-bottom:0.4rem;display:none"></div>
      <div class="wizard-results" id="edit-target-results"></div>
    </div>
    <div class="edit-modal-field">
      <label>어떤 요청인가요?</label>
      <select id="edit-request-type">
        <option value="edit">기존 정보 수정</option>
        <option value="create">새로 추가</option>
        <option value="delete">삭제 요청</option>
      </select>
    </div>
    <div class="edit-modal-field">
      <label>한 줄 요약</label>
      <input type="text" id="edit-summary" placeholder="예: 공연 날짜가 잘못됐어요">
    </div>
    <div class="edit-modal-field">
      <label>자세한 내용 (선택)</label>
      <textarea id="edit-details" rows="3" placeholder="구체적으로 어떻게 바뀌어야 하는지 알려주세요"></textarea>
    </div>
    <div class="edit-modal-actions">
      <button class="pf-btn" onclick="closeEditModal()">취소</button>
      <button class="pf-btn pf-active" onclick="submitEditRequest()">보내기</button>
    </div>
    <div id="edit-modal-msg" style="font-size:0.76rem;color:var(--muted);margin-top:0.6rem"></div>
  </div>
</div>

<div class="wizard-overlay" id="wizard-overlay">
  <div class="wizard-card">
    <div class="wizard-top-row">
      <button class="wizard-back-btn" id="wizard-back-btn" onclick="wizardBack()" title="이전으로">←</button>
      <div class="wizard-progress" id="wizard-progress"></div>
      <button class="wizard-close-btn" onclick="closeWizard()" title="취소">✕</button>
    </div>
    <div class="wizard-content" id="wizard-content"></div>
  </div>
</div>

<div class="wizard-overlay" id="connect-overlay">
  <div class="wizard-card">
    <div class="wizard-top-row">
      <div class="wizard-progress">프로필 연결</div>
      <button class="wizard-close-btn" onclick="closeConnectPrompt()" title="나중에 하기">✕</button>
    </div>
    <div class="wizard-content" id="connect-content">
      <div class="wizard-question">오리에 남아있는 내 참여 이력을 찾아볼까요?</div>
      <input type="text" class="wizard-search" id="connect-search" placeholder="내 이름으로 검색..." oninput="connectFilterList(this.value)">
      <div class="wizard-results" id="connect-results"></div>
      <button class="wizard-skip-btn" onclick="closeConnectPrompt()">나중에 할게요</button>
    </div>
  </div>
</div>

<div class="wizard-overlay" id="license-inquiry-overlay">
  <div class="wizard-card">
    <div class="wizard-top-row">
      <div class="wizard-progress">라이선스 문의</div>
      <button class="wizard-close-btn" onclick="closeLicenseInquiry()" title="닫기">✕</button>
    </div>
    <div class="wizard-content">
      <div class="wizard-question" id="license-inquiry-title">라이선스가 궁금하신가요?</div>
      <div style="font-size:0.78rem;color:var(--muted);margin-bottom:1rem">저작권 관련 문의를 남겨주시면, 확인 후 라이선스 확보 방법과 대략적인 비용 가이드를 안내해드려요.</div>
      <div class="edit-modal-field"><label>문의 내용</label><textarea id="license-inquiry-message" rows="3" placeholder="어떤 게 궁금하신지 적어주세요 (예: 아마추어 공연 라이선스 비용이 궁금해요)"></textarea></div>
      <div class="edit-modal-field"><label>연락처 (선택)</label><input type="text" id="license-inquiry-contact" placeholder="이메일, 카카오톡 오픈채팅 등"></div>
      <button class="pf-btn pf-active" style="width:100%" onclick="submitLicenseInquiry()">문의 보내기</button>
      <div id="license-inquiry-msg" style="font-size:0.76rem;color:var(--muted);margin-top:0.6rem;text-align:center"></div>
    </div>
  </div>
</div>

<div class="wizard-overlay" id="ori-modal-overlay">
  <div class="wizard-card ori-modal-card">
    <div class="wizard-content">
      <div class="wizard-question" id="ori-modal-message"></div>
      <div class="edit-modal-field" id="ori-modal-input-field" style="display:none">
        <input type="text" id="ori-modal-input" class="wizard-search" style="margin-bottom:0">
      </div>
      <div id="ori-modal-actions" class="ori-modal-actions"></div>
    </div>
  </div>
</div>

<nav class="mobile-tab-bar" id="mob-nav">
  <button class="mob-tab" id="mobt-home" onclick="goHome()"><span class="mob-icon">🦆</span>홈</button>
  <button class="mob-tab" id="mobt-shows" onclick="goShows()"><span class="mob-icon">🎭</span>공연</button>
  <button class="mob-tab" id="mobt-works" onclick="goWorks()"><span class="mob-icon">📖</span>작품</button>
  <button class="mob-tab" id="mobt-people" onclick="goPeople()"><span class="mob-icon">👤</span>사람</button>
  <button class="mob-tab" id="mobt-projects" onclick="goProjectBrowse()"><span class="mob-icon">📣</span>모집</button>
  <button class="mob-tab" id="mobt-my" onclick="goMyShows()"><span class="mob-icon">🎪</span>내 공연</button>
</nav>
