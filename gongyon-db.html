function workGenre(w){
  var candidates=['구분','장르','유형','분류','작품유형','장르구분','공연유형','Genre','genre'];
  for(var i=0;i<candidates.length;i++){
    var v=fld(w,candidates[i]);
    if(v){return typeof v==='string'?v:(v.name||(Array.isArray(v)?v.join(', '):String(v)));}
  }
  return '';
}

function renderWorkIndex(){
  // 국가 옵션 수집
  var countrySet={};
  _allWorks.forEach(function(w){
    var c=fld(w,'국가')||fld(w,'원작국가')||fld(w,'나라')||'';
    if(c){(Array.isArray(c)?c:[c]).forEach(function(v){if(v)countrySet[v]=true;});}
  });
  var countries=Object.keys(countrySet).sort();

  // 장르 옵션 수집
  var genreSet={};
  _allWorks.forEach(function(w){var g=workGenre(w);if(g)genreSet[g]=true;});
  var genres=Object.keys(genreSet).sort();

  // 필터 적용
  var filtered=_allWorks.filter(function(w){
    if(_workFilter.country){
      var c=fld(w,'국가')||fld(w,'원작국가')||fld(w,'나라')||'';
      var vals=Array.isArray(c)?c:[c];
      if(vals.indexOf(_workFilter.country)===-1)return false;
    }
    if(_workFilter.genre){
      if(workGenre(w)!==_workFilter.genre)return false;
    }
    if(_workFilter.minCast>0){
      var roleCnt=DB.roles.filter(function(r){return ids(fld(r,'작품')).indexOf(w.id)>-1;}).length;
      if(roleCnt<_workFilter.minCast)return false;
    }
    return true;
  });

  var hasFilter=!!_workFilter.country||!!_workFilter.genre||_workFilter.minCast>0;
  var filterH='<div class="filter-panel"><div class="filter-panel-top"><span class="filter-panel-title">필터</span>'+(hasFilter?'<button class="filter-clear-btn" onclick="clearWorkFilter()">전체 초기화</button>':'')+'</div><div class="filter-rows">';

  // 장르 필터
  if(genres.length){
    filterH+='<div class="filter-row"><span class="filter-row-label">장르</span><div class="filter-chips">';
    filterH+='<button class="fchip'+(!_workFilter.genre?' on':'')+'" onclick="_workFilter.genre=\'\';renderWorkIndex()">전체</button>';
    genres.forEach(function(g){var on=_workFilter.genre===g;filterH+='<button class="fchip'+(on?' on':'')+'" onclick="_workFilter.genre=\''+g+'\';renderWorkIndex()">'+g+'</button>';});
    filterH+='</div></div>';
  }

  // 국가 필터
  if(countries.length){
    filterH+='<div class="filter-row"><span class="filter-row-label">국가</span><div class="filter-chips">';
    filterH+='<button class="fchip'+(!_workFilter.country?' on':'')+'" onclick="_workFilter.country=\'\';renderWorkIndex()">전체</button>';
    countries.forEach(function(c){var on=_workFilter.country===c;filterH+='<button class="fchip'+(on?' on':'')+'" onclick="_workFilter.country=\''+c+'\';renderWorkIndex()">'+c+'</button>';});
    filterH+='</div></div>';
  }

  // 배역 인원 필터
  var mc=_workFilter.minCast;
  filterH+='<div class="filter-row"><span class="filter-row-label">배역 인원</span><div class="filter-chips">'
    +'<button class="fchip'+(mc===0?' on':'')+'" onclick="_workFilter.minCast=0;renderWorkIndex()">전체</button>'
    +'<button class="fchip'+(mc===3?' on':'')+'" onclick="_workFilter.minCast=3;renderWorkIndex()">3명 이상</button>'
    +'<button class="fchip'+(mc===5?' on':'')+'" onclick="_workFilter.minCast=5;renderWorkIndex()">5명 이상</button>'
    +'<button class="fchip'+(mc===10?' on':'')+'" onclick="_workFilter.minCast=10;renderWorkIndex()">10명 이상</button>'
    +'</div></div>';

  filterH+='</div></div>';
  var resultH='<div class="result-header"><span class="result-count"><em>'+filtered.length+'</em>개 작품</span><div class="result-view-btns"><button class="rvb'+(_workIndexView==='grid'?' on':'')+'" onclick="_workIndexView=\'grid\';renderWorkIndex()">▦</button><button class="rvb'+(_workIndexView==='list'?' on':'')+'" onclick="_workIndexView=\'list\';renderWorkIndex()">≡</button></div></div>';

  var listH='';
  if(!filtered.length){listH='<div class="result-empty"><div class="result-empty-icon">📖</div>조건에 맞는 작품이 없어요.</div>';}
  else if(_workIndexView==='grid'){
    listH='<div class="result-grid">';
    filtered.forEach(function(w){
      var shows=DB.shows.filter(function(s){return ids(fld(s,'작품')).indexOf(w.id)>-1;});
      var roleCnt=DB.roles.filter(function(r){return ids(fld(r,'작품')).indexOf(w.id)>-1;}).length;
      var country=fld(w,'국가')||fld(w,'원작국가')||fld(w,'나라')||'';
      var countryLabel=Array.isArray(country)?country.join(', '):country;
      var genre=workGenre(w);
      var wTags=fld(w,'태그')||[];
      var tagsRowH='';
      if(genre||wTags.length){
        tagsRowH='<div class="result-card-tags">'+(genre?'<span class="result-card-tag">'+genre+'</span>':'')+wTags.map(function(t){return '<span class="result-card-tag">'+t+'</span>';}).join('')+'</div>';
      }
      var wPhoto=(fld(w,'사진')||[])[0];
      var wPhotoH=wPhoto?'<img src="'+wPhoto.url+'" style="width:100%;height:100%;object-fit:cover;border-radius:8px">':'📖';
      listH+='<div class="result-card" data-action="work" data-id="'+w.id+'">'+favBtnHtml('work',w.id)+wishBtnHtml('work',w.id)
        +'<div class="result-card-ph">'+wPhotoH+'</div><div class="result-card-body"><div class="result-card-title">'+fld(w,'작품명')+'</div>'+(fld(w,'작품명 (영문)')?'<div class="result-card-sub">'+fld(w,'작품명 (영문)')+'</div>':'')+(countryLabel?'<div class="result-card-sub">'+countryLabel+'</div>':'')+'<div class="result-card-sub">공연 '+shows.length+'개'+(roleCnt?' · 배역 '+roleCnt+'명':'')+'</div>'+tagsRowH+'</div></div>';
    });
    listH+='</div>';
  } else {
    listH='<div class="result-list">';
    filtered.forEach(function(w){
      var shows=DB.shows.filter(function(s){return ids(fld(s,'작품')).indexOf(w.id)>-1;});
      var roleCnt=DB.roles.filter(function(r){return ids(fld(r,'작품')).indexOf(w.id)>-1;}).length;
      var country=fld(w,'국가')||fld(w,'원작국가')||fld(w,'나라')||'';
      var countryLabel=Array.isArray(country)?country.join(', '):country;
      var genre=workGenre(w);
      listH+='<div class="result-row" data-action="work" data-id="'+w.id+'"><div class="rr-poster">📖</div><div class="rr-main"><div class="rr-title">'+fld(w,'작품명')+'</div><div class="rr-meta">'+(genre?'<span class="rr-tag" style="color:var(--accent)">'+genre+'</span>':'')+(fld(w,'작품명 (영문)')?'<span class="rr-tag">'+fld(w,'작품명 (영문)')+'</span>':'')+(countryLabel?'<span class="rr-tag">'+countryLabel+'</span>':'')+'<span class="rr-tag">공연 '+shows.length+'개</span>'+(roleCnt?'<span class="rr-tag">배역 '+roleCnt+'명</span>':'')+'</div></div></div>';
    });
    listH+='</div>';
  }
  mn('<div class="tab-index">'+filterH+resultH+listH+'</div>');

var _roleFilter={work:'all',gender:'',minAct:0,tags:[]};
var _roleIndexView='grid';
var _roleWorkOptions=[];

function goRoles(push){

  });

function roleWorkFilterInput(q){
  var dd=document.getElementById('role-work-filter-dropdown');
  if(!dd)return;
  var query=(q||'').trim().toLowerCase();
  var matches=_roleWorkOptions.filter(function(w){return !query||w.name.toLowerCase().includes(query);}).slice(0,50);
  if(!matches.length){dd.innerHTML='<div class="gs-empty">검색 결과 없음</div>';}
  else{
    dd.innerHTML=matches.map(function(w){return '<div class="gs-item" onmousedown="selectRoleWorkFilter(\''+w.id+'\')"><div class="gs-item-main"><div class="gs-item-name">'+w.name+'</div></div></div>';}).join('');

function roleWorkFilterFocus(){var inp=document.getElementById('role-work-filter-input');roleWorkFilterInput(inp?inp.value:'');}

document.addEventListener('click',function(e){

function toggleRoleTagFilter(t){

function renderRoleIndex(){
  var workSet={};
  _allRoles.forEach(function(r){var wid=ids(fld(r,'작품'))[0]||'';if(wid&&nm(wid))workSet[wid]=nm(wid);});
  var workIds=Object.keys(workSet).sort(function(a,b){return workSet[a].localeCompare(workSet[b]);});
  _roleWorkOptions=workIds.map(function(wid){return{id:wid,name:workSet[wid]};});

  // 성별 옵션 수집
  var genderSet={};
  _allRoles.forEach(function(r){var g=fld(r,'성별')||fld(r,'젠더')||'';if(g)genderSet[g]=true;});
  var genders=Object.keys(genderSet).sort();

  // 태그 옵션 수집
  var tagSet={};
  _allRoles.forEach(function(r){(fld(r,'태그')||[]).forEach(function(t){if(t)tagSet[t]=true;});});
  var tagList=Object.keys(tagSet).sort();

  // 필터 적용
  var filtered=_allRoles.filter(function(r){
    if(_roleFilter.work!=='all'&&ids(fld(r,'작품')).indexOf(_roleFilter.work)===-1)return false;
    if(_roleFilter.gender&&(fld(r,'성별')||fld(r,'젠더')||'')!==_roleFilter.gender)return false;
    if(_roleFilter.tags.length){
      var rTags=fld(r,'태그')||[];
      if(!_roleFilter.tags.every(function(t){return rTags.indexOf(t)>-1;}))return false;
    }
    if(_roleFilter.minAct>0){
      var cnt=DB.history.filter(function(h){return isValidH(h)&&ids(fld(h,'배역')).indexOf(r.id)>-1;}).length;
      if(cnt<_roleFilter.minAct)return false;
    }
    return true;
  });

  var hasFilter=_roleFilter.work!=='all'||!!_roleFilter.gender||_roleFilter.minAct>0||_roleFilter.tags.length>0;
  var filterH='<div class="filter-panel"><div class="filter-panel-top"><span class="filter-panel-title">필터</span>'+(hasFilter?'<button class="filter-clear-btn" onclick="_roleFilter={work:\'all\',gender:\'\',minAct:0,tags:[]};renderRoleIndex()">전체 초기화</button>':''  )+'</div><div class="filter-rows">';

  // 작품 필터 (검색형 드롭다운 - 작품 수가 많아 칩 나열 대신 검색으로 고른다)
  if(workIds.length){
    var selectedWorkName=_roleFilter.work!=='all'?nm(_roleFilter.work):'';
    filterH+='<div class="filter-row"><span class="filter-row-label">작품</span><div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap">'
      +'<div class="global-search" id="role-work-filter-wrap" style="max-width:260px;margin:0">'
      +'<span class="gs-icon">🔍</span>'
      +'<input type="text" id="role-work-filter-input" placeholder="작품 검색..." autocomplete="off" oninput="roleWorkFilterInput(this.value)" onfocus="roleWorkFilterFocus()">'
      +'<div class="gs-dropdown" id="role-work-filter-dropdown"></div>'
      +'</div>'
      +(selectedWorkName?'<button class="fchip on" onclick="clearRoleWorkFilter()">'+selectedWorkName+' ✕</button>':'')
      +'</div></div>';
  }

  // 성별 필터
  if(genders.length){
    filterH+='<div class="filter-row"><span class="filter-row-label">성별</span><div class="filter-chips">';
    filterH+='<button class="fchip'+(!_roleFilter.gender?' on':'')+'" onclick="_roleFilter.gender=\'\';renderRoleIndex()">전체</button>';
    genders.forEach(function(g){var on=_roleFilter.gender===g;filterH+='<button class="fchip'+(on?' on':'')+'" onclick="_roleFilter.gender=\''+g+'\';renderRoleIndex()">'+g+'</button>';});
    filterH+='</div></div>';
  }

  // 태그 필터 (다중 선택)
  if(tagList.length){
    filterH+='<div class="filter-row"><span class="filter-row-label">태그</span><div class="filter-chips">';
    tagList.forEach(function(t){var on=_roleFilter.tags.indexOf(t)>-1;filterH+='<button class="fchip'+(on?' on':'')+'" onclick="toggleRoleTagFilter(\''+t+'\')">'+t+'</button>';});
    filterH+='</div></div>';
  }

  // 출연 이력 횟수 필터
  var ma=_roleFilter.minAct;
  filterH+='<div class="filter-row"><span class="filter-row-label">출연 횟수</span><div class="filter-chips">'
    +'<button class="fchip'+(ma===0?' on':'')+'" onclick="_roleFilter.minAct=0;renderRoleIndex()">전체</button>'
    +'<button class="fchip'+(ma===2?' on':'')+'" onclick="_roleFilter.minAct=2;renderRoleIndex()">2회 이상</button>'
    +'<button class="fchip'+(ma===3?' on':'')+'" onclick="_roleFilter.minAct=3;renderRoleIndex()">3회 이상</button>'
    +'<button class="fchip'+(ma===5?' on':'')+'" onclick="_roleFilter.minAct=5;renderRoleIndex()">5회 이상</button>'
    +'</div></div>';

  filterH+='</div></div>';
  var resultH='<div class="result-header"><span class="result-count"><em>'+filtered.length+'</em>개 배역</span><div class="result-view-btns"><button class="rvb'+(_roleIndexView==='grid'?' on':'')+'" onclick="_roleIndexView=\'grid\';renderRoleIndex()">▦</button><button class="rvb'+(_roleIndexView==='list'?' on':'')+'" onclick="_roleIndexView=\'list\';renderRoleIndex()">≡</button></div></div>';

  var listH='';
  if(!filtered.length){listH='<div class="result-empty"><div class="result-empty-icon">🎬</div>해당하는 배역이 없어요.</div>';}
  else if(_roleIndexView==='grid'){
    listH='<div class="result-grid">';
    filtered.forEach(function(r){
      var wid=ids(fld(r,'작품'))[0]||'';
      var gender=fld(r,'성별')||fld(r,'젠더')||'';
      var rTags=fld(r,'태그')||[];
      var rTagsH=rTags.length?('<div class="result-card-tags">'+rTags.map(function(t){return '<span class="result-card-tag">'+t+'</span>';}).join('')+'</div>'):'';
      var rPhoto=(fld(r,'사진')||[])[0];
      var rPhotoH=rPhoto?'<img src="'+rPhoto.url+'" style="width:100%;height:100%;object-fit:cover;border-radius:8px">':'🎬';
      listH+='<div class="result-card" data-action="role" data-id="'+r.id+'">'+wishBtnHtml('role',r.id)+'<div class="result-card-ph">'+rPhotoH+'</div><div class="result-card-body"><div class="result-card-title">'+fld(r,'배역명')+'</div>'+(nm(wid)?'<div class="result-card-sub">'+nm(wid)+'</div>':'')+(gender?'<div class="result-card-sub">'+gender+'</div>':'')+rTagsH+'</div></div>';
    });
    listH+='</div>';
  } else {
    listH='<div class="result-list">';
    filtered.forEach(function(r){
      var wid=ids(fld(r,'작품'))[0]||'';
      var gender=fld(r,'성별')||fld(r,'젠더')||'';
      var actCnt=DB.history.filter(function(h){return isValidH(h)&&ids(fld(h,'배역')).indexOf(r.id)>-1;}).length;
      listH+='<div class="result-row" data-action="role" data-id="'+r.id+'"><div class="rr-poster">🎬</div><div class="rr-main"><div class="rr-title">'+fld(r,'배역명')+'</div><div class="rr-meta">'+(nm(wid)?'<span class="rr-tag">'+nm(wid)+'</span>':'')+(gender?'<span class="rr-tag">'+gender+'</span>':'')+(actCnt?'<span class="rr-tag">'+actCnt+'명 출연</span>':'')+'</div></div></div>';
    });
    listH+='</div>';
  }
  mn('<div class="tab-index">'+filterH+resultH+listH+'</div>');
}

function buildPhotoGalleryHtml(photos,altText,skipFirst){
  photos=(photos||[]).filter(function(p){return p&&p.url;});
  if(skipFirst===false){
    if(!photos.length)return '';
  }else{
    if(photos.length<2)return '';
    photos=photos.slice(1);
  }
  var rest=photos;
  var GALLERY_INITIAL=12;
  var h='<div class="person-gallery-full"><div class="person-gallery-grid-wide">';
  rest.forEach(function(p,i){h+='<img src="'+p.url+'" alt="'+escHtml(altText||'')+'"'+(i>=GALLERY_INITIAL?' class="gallery-extra-hidden"':'')+'>';});
  h+='</div>';
  if(rest.length>GALLERY_INITIAL)h+='<button class="person-gallery-more-btn" data-hidden-count="'+(rest.length-GALLERY_INITIAL)+'" onclick="togglePersonGalleryWide(this)">+'+(rest.length-GALLERY_INITIAL)+'장 더보기</button>';
  h+='</div>';
  return h;
}
function togglePersonGalleryWide(btn){
  var grid=btn.previousElementSibling;if(!grid)return;
  var expanded=grid.classList.toggle('gallery-expanded');
  btn.textContent=expanded?'접기':('+'+btn.dataset.hiddenCount+'장 더보기');
}
async function renderWishlistInterest(type,id,elId){
  var el=$(elId);if(!el)return;

    var r=await sbClient.rpc('list_wishlist_interest',{p_target_type:type,p_target_id:id});

async function uploadMyPhoto(input){
  var file=input.files&&input.files[0];if(!file)return;
  var msgEl=$('my-photo-upload-msg');
  if(msgEl)msgEl.textContent='업로드 중…';
  try{
    var ext=(file.name.split('.').pop()||'jpg').toLowerCase();
    var path='people/'+CURRENT_USER.personId+'/'+Date.now()+'.'+ext;
    var up=await sbClient.storage.from('photos').upload(path,file);
    if(up.error)throw up.error;
    var pub=sbClient.storage.from('photos').getPublicUrl(path);
    var url=pub.data.publicUrl;
    var r=await sbClient.rpc('add_own_person_photo',{photo_url:url});
    if(r.error)throw r.error;
    renderMyPageInfo($('mypage-tab-content'));
  }catch(e){
    if(msgEl)msgEl.textContent='업로드 실패: '+e.message;
  }
}
async function removeMyPhoto(url){
  if(!await oriConfirm('이 사진을 삭제할까요?'))return;
  try{
    var r=await sbClient.rpc('remove_own_person_photo',{photo_url:url});
    if(r.error)throw r.error;
    renderMyPageInfo($('mypage-tab-content'));
  }catch(e){oriAlert('삭제 실패: '+e.message);}
}
async function setPrimaryPhoto(url){
  try{
    var r=await sbClient.rpc('set_primary_person_photo',{photo_url:url});
    if(r.error)throw r.error;
    renderMyPageInfo($('mypage-tab-content'));
  }catch(e){oriAlert('설정 실패: '+e.message);}
}

function venueSeats(v){
  var candidates=['좌석수','좌석 수','객석수','객석 수','수용인원','좌석규모','좌석 규모','좌석','Capacity','capacity','Seats','seats'];
  // '좌석수' is confirmed the correct field name; kept first in the list, others remain as fallback.
  for(var i=0;i<candidates.length;i++){
    var val=fld(v,candidates[i]);
    if(val!=null&&val!==''){return val;}
  }
  return null;
}
function venueSeatsMax(v){
  var val=fld(v,'좌석수_최대');
  return(val!=null&&val!=='')?val:null;
}
function venueSeatsLabel(v){
  var min=venueSeats(v),max=venueSeatsMax(v);
  if(min==null&&max==null)return '';
  if(min!=null&&max!=null&&max!==min)return min+'~'+max+'석';
  return(min!=null?min:max)+'석';
}
function venueSizeTier(seats){
  if(seats==null)return '';
  if(seats<100)return '소극장';
  if(seats<300)return '중극장';
  return '대극장';
}

      var vphoto=iurl(fld(v,'사진'));
      var vphH=vphoto?'<img src="'+vphoto+'" style="width:100%;height:100%;object-fit:cover;border-radius:8px">':'📍';
      listH+='<div class="result-card" data-action="venue" data-id="'+v.id+'">'+favBtnHtml('venue',v.id)+'<div class="result-card-ph">'+vphH+'</div><div class="result-card-body"><div class="result-card-title">'+fld(v,'극장명')+'</div><div class="result-card-sub">공연 '+showCntMap[v.id]+'개'+(seatsLabel?' · 좌석 '+seatsLabel:'')+'</div></div></div>';
    });
    listH+='</div>';
  }
  mn('<div class="tab-index">'+filterH+resultH+listH+'</div>');
}
function showVenue(vid,push){
  if(push!==false)history.pushState({view:'venue',id:vid},'','#venue-'+vid);
  setNav('venues');setIndexMode(false);mobShowDetail();
  var venue=DB.venues.find(function(v){return v.id===vid;});if(!venue)return;
  var shows=sortShows(DB.shows.filter(function(s){return ids(fld(s,'극장')).indexOf(vid)>-1;}));
  var seatsLabel=venueSeatsLabel(venue);
  var venuePhotos=fld(venue,'사진')||[];
  var h='<div class="detail-header"><div class="eyebrow">극장</div><div class="detail-title">'+fld(venue,'극장명')+favBtnHtml('venue',vid)+'</div><div class="detail-meta"><span>공연 '+shows.length+'개</span>'+(seatsLabel?'<span>💺 좌석 '+seatsLabel+'</span>':'')+'</div></div>';
  h+=buildPhotoGalleryHtml(venuePhotos,fld(venue,'극장명'),false);
  var vRentalFee=fld(venue,'대관료');
  var vRentalAvail=fld(venue,'대관가능여부');
  var vContact=fld(venue,'연락처');
  var vParking=fld(venue,'주차가능여부');
  var vTransit=fld(venue,'대중교통정보');
  var vInfoRows=[];
  if(vRentalAvail!=null)vInfoRows.push('<div class="info-row"><span class="info-row-label">대관 가능여부</span><span>'+(vRentalAvail?'가능':'불가')+'</span></div>');
  if(vRentalFee)vInfoRows.push('<div class="info-row"><span class="info-row-label">대관료</span><span>'+vRentalFee+'</span></div>');
  if(vContact)vInfoRows.push('<div class="info-row"><span class="info-row-label">연락처</span><span>'+vContact+'</span></div>');
  if(vParking!=null)vInfoRows.push('<div class="info-row"><span class="info-row-label">주차</span><span>'+(vParking?'가능':'불가')+'</span></div>');
  if(vTransit)vInfoRows.push('<div class="info-row"><span class="info-row-label">대중교통</span><span>'+vTransit+'</span></div>');
  if(vInfoRows.length){
    h+='<div class="sec"><div class="sec-label">실전 정보</div><div class="info-rows">'+vInfoRows.join('')+'</div></div>';
  }
  if(shows.length){
    var vYearCntMap={};shows.forEach(function(s){var y=yearOf(fld(s,'공연 날짜')||'')||'연도 미상';vYearCntMap[y]=(vYearCntMap[y]||0)+1;});
    var vYears=Object.keys(vYearCntMap).sort().reverse();
    window._venueShows=shows;
    window._venueActiveYear='all';
    window._renderVenueShowGrid=function(yearArg){
      if(yearArg!==undefined)window._venueActiveYear=yearArg;
      var yearFilter=window._venueActiveYear;
      var filtered=window._venueShows.filter(function(s){
        if(yearFilter==='all')return true;
        return(yearOf(fld(s,'공연 날짜')||'')||'연도 미상')===yearFilter;
      });
      var gridH='';
      filtered.forEach(function(s){
        var wid=ids(fld(s,'작품'))[0]||'';
        var p=POSTER[s.id]||'';
        gridH+='<div class="item-card" data-action="show" data-id="'+s.id+'">'
          +(p?'<img src="'+p+'" style="width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:4px;margin-bottom:0.6rem">':'')
          +'<div class="item-card-title">'+fld(s,'공연명')+'</div>'
          +'<div class="item-card-sub">'+nm(wid)+(fld(s,'공연 날짜')?' · '+ym(fld(s,'공연 날짜')):'')+'</div>'
          +'</div>';
      });
      var el=document.getElementById('venue-show-grid');if(el)el.innerHTML=gridH||'<div class="empty" style="grid-column:1/-1">해당 공연이 없습니다.</div>';
      document.querySelectorAll('.vf-year-btn').forEach(function(btn){btn.classList.toggle('pf-active',btn.dataset.year===yearFilter);});
    };
    var vYearBtnsH='<button class="pf-btn vf-year-btn pf-active" data-year="all" onclick="_renderVenueShowGrid(\'all\')">전체</button>';
    vYears.forEach(function(y){vYearBtnsH+='<button class="pf-btn vf-year-btn" data-year="'+y+'" onclick="_renderVenueShowGrid(\''+y+'\')">'+y+'</button>';});
    h+='<div class="sec"><div class="sec-label">공연 목록</div>'
      +'<div style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.8rem">'+vYearBtnsH+'</div>'
      +'<div class="item-grid" id="venue-show-grid"></div></div>';
  } else {h+='<div class="empty">등록된 공연이 없습니다.</div>';}
  mn(h);
  if(window._renderVenueShowGrid)_renderVenueShowGrid('all');
  injectBackBtn('← 극장',function(){goVenues();});
}

var _troupeFilter={orgType:'',memberBase:'',region:'',status:'',sort:'name'};
function goTroupes(push){
  if(push!==false)history.pushState({view:'troupes'},'','#troupes');
  setNav('troupes');_sbContext='troupes';setIndexMode(true);
  _allTroupes=DB.troupes.filter(function(t){return fld(t,'극단명');});
  _troupeFilter={orgType:'',memberBase:'',region:'',status:'',sort:'name'};
  renderTroupeIndex();
}
function clearTroupeFilter(){_troupeFilter={orgType:'',memberBase:'',region:'',status:'',sort:'name'};renderTroupeIndex();}

function renderTroupeIndex(){
  var all=_allTroupes;
  if(!all.length){mn('<div class="tab-index"><div class="result-empty"><div class="result-empty-icon">🏢</div>단체 데이터가 없습니다.</div></div>');return;}

  var showCntMap={},memberCntMap={};
  all.forEach(function(t){
    var shows=DB.shows.filter(function(s){return ids(fld(s,'극단')).indexOf(t.id)>-1;});
    showCntMap[t.id]=shows.length;
    var memberSet={};
    shows.forEach(function(s){
      DB.history.filter(function(h){return isValidH(h)&&ids(fld(h,'공연')).indexOf(s.id)>-1;})
        .forEach(function(h){var pid=ids(fld(h,'참여자'))[0]||'';if(pid)memberSet[pid]=true;});
    });
    memberCntMap[t.id]=Object.keys(memberSet).length;
  });

  var orgTypeSet={},memberBaseSet={},regionSet={},statusSet={};
  all.forEach(function(t){var o=fld(t,'조직형태')||[];(Array.isArray(o)?o:[o]).forEach(function(v){if(v)orgTypeSet[v]=true;});var m=fld(t,'구성원기반');if(m)memberBaseSet[m]=true;var r=fld(t,'활동지역');if(r)regionSet[r]=true;var s=fld(t,'운영상태');if(s)statusSet[s]=true;});
  var orgTypes=Object.keys(orgTypeSet).sort();
  var memberBases=Object.keys(memberBaseSet).sort();
  var regions=Object.keys(regionSet).sort();
  var statuses=Object.keys(statusSet).sort();

  var filtered=all.filter(function(t){
    if(_troupeFilter.orgType&&(fld(t,'조직형태')||[]).indexOf(_troupeFilter.orgType)===-1)return false;
    if(_troupeFilter.memberBase&&fld(t,'구성원기반')!==_troupeFilter.memberBase)return false;
    if(_troupeFilter.region&&fld(t,'활동지역')!==_troupeFilter.region)return false;
    if(_troupeFilter.status&&fld(t,'운영상태')!==_troupeFilter.status)return false;
    return true;
  });

  if(_troupeFilter.sort==='shows'){
    filtered=filtered.slice().sort(function(a,b){return showCntMap[b.id]-showCntMap[a.id];});
  } else if(_troupeFilter.sort==='members'){
    filtered=filtered.slice().sort(function(a,b){return memberCntMap[b.id]-memberCntMap[a.id];});
  } else {
    filtered=filtered.slice().sort(function(a,b){return(fld(a,'극단명')||'').localeCompare(fld(b,'극단명')||'');});
  }

  var hasFilter=!!_troupeFilter.orgType||!!_troupeFilter.memberBase||!!_troupeFilter.region||!!_troupeFilter.status||_troupeFilter.sort!=='name';
  var filterH='<div class="filter-panel"><div class="filter-panel-top"><span class="filter-panel-title">필터 / 정렬</span>'
    +(hasFilter?'<button class="filter-clear-btn" onclick="clearTroupeFilter()">전체 초기화</button>':'')
    +'</div><div class="filter-rows">';

  if(orgTypes.length){
    filterH+='<div class="filter-row"><span class="filter-row-label">조직형태</span><div class="filter-chips">'
      +'<button class="fchip'+(!_troupeFilter.orgType?' on':'')+'" onclick="_troupeFilter.orgType=\'\';renderTroupeIndex()">전체</button>'
      +orgTypes.map(function(o){return '<button class="fchip'+(_troupeFilter.orgType===o?' on':'')+'" onclick="_troupeFilter.orgType=\''+o+'\';renderTroupeIndex()">'+o+'</button>';}).join('')
      +'</div></div>';
  }
  if(memberBases.length){
    filterH+='<div class="filter-row"><span class="filter-row-label">구성원기반</span><div class="filter-chips">'
      +'<button class="fchip'+(!_troupeFilter.memberBase?' on':'')+'" onclick="_troupeFilter.memberBase=\'\';renderTroupeIndex()">전체</button>'
      +memberBases.map(function(m){return '<button class="fchip'+(_troupeFilter.memberBase===m?' on':'')+'" onclick="_troupeFilter.memberBase=\''+m+'\';renderTroupeIndex()">'+m+'</button>';}).join('')
      +'</div></div>';
  }
  if(regions.length){
    filterH+='<div class="filter-row"><span class="filter-row-label">활동지역</span><div class="filter-chips">'
      +'<button class="fchip'+(!_troupeFilter.region?' on':'')+'" onclick="_troupeFilter.region=\'\';renderTroupeIndex()">전체</button>'
      +regions.map(function(r){return '<button class="fchip'+(_troupeFilter.region===r?' on':'')+'" onclick="_troupeFilter.region=\''+r+'\';renderTroupeIndex()">'+r+'</button>';}).join('')
      +'</div></div>';
  }
  if(statuses.length){
    filterH+='<div class="filter-row"><span class="filter-row-label">운영상태</span><div class="filter-chips">'
      +'<button class="fchip'+(!_troupeFilter.status?' on':'')+'" onclick="_troupeFilter.status=\'\';renderTroupeIndex()">전체</button>'
      +statuses.map(function(s){return '<button class="fchip'+(_troupeFilter.status===s?' on':'')+'" onclick="_troupeFilter.status=\''+s+'\';renderTroupeIndex()">'+s+'</button>';}).join('')
      +'</div></div>';
  }
  filterH+='<div class="filter-row"><span class="filter-row-label">정렬</span><div class="filter-chips">'
    +'<button class="fchip'+(_troupeFilter.sort==='name'?' on':'')+'" onclick="_troupeFilter.sort=\'name\';renderTroupeIndex()">이름순</button>'
    +'<button class="fchip'+(_troupeFilter.sort==='shows'?' on':'')+'" onclick="_troupeFilter.sort=\'shows\';renderTroupeIndex()">공연 많은순</button>'
    +'<button class="fchip'+(_troupeFilter.sort==='members'?' on':'')+'" onclick="_troupeFilter.sort=\'members\';renderTroupeIndex()">참여 사람 많은순</button>'
    +'</div></div></div></div>';

  var resultH='<div class="result-header"><span class="result-count"><em>'+filtered.length+'</em>개 단체</span></div>';

  var listH='';
  if(!filtered.length){
    listH='<div class="result-empty"><div class="result-empty-icon">🏢</div>해당하는 단체가 없어요.</div>';
  } else {
    listH='<div class="result-grid">';
    filtered.forEach(function(t){
      var tphoto=iurl(fld(t,'사진'));
      var tphH=tphoto?'<img src="'+tphoto+'" style="width:100%;height:100%;object-fit:cover;border-radius:8px">':'🏢';
      listH+='<div class="result-card" data-action="troupe" data-id="'+t.id+'">'+favBtnHtml('troupe',t.id)
        +'<div class="result-card-ph">'+tphH+'</div>'
        +'<div class="result-card-body">'
        +'<div class="result-card-title">'+fld(t,'극단명')+'</div>'
        +'<div class="result-card-sub">공연 '+showCntMap[t.id]+'개</div>'
        +(memberCntMap[t.id]?'<div class="result-card-sub">사람 '+memberCntMap[t.id]+'명</div>':'')
        +'</div></div>';
    });
    listH+='</div>';
  }
  mn('<div class="tab-index">'+filterH+resultH+listH+'</div>');
}

function routeFromHash(hash){
  var h=hash||location.hash;
  if(!h||h==='#home'){goHome(false);return;}
  if(h==='#shows'){goShows(false);return;}
  if(h==='#people'){goPeople(false);return;}
  if(h==='#works'){goWorks(false);return;}
  if(h==='#roles'){goRoles(false);return;}
  if(h==='#venues'){goVenues(false);return;}
  if(h==='#troupes'){goTroupes(false);return;}
  if(h==='#content'){goContent(false);return;}
  if(h==='#dashboard'){goDashboard(false);return;}
  if(h==='#mypage'){goMyPage(false);return;}
  if(h==='#projects'){goProjectBrowse(false);return;}
  if(h==='#terms'){goTerms(false);return;}
  if(h==='#privacy'){goPrivacy(false);return;}
  var m;
  if(m=h.match(/^#show-(.+)$/)){showShow(m[1],false);return;}
  if(m=h.match(/^#person-(.+)$/)){showPerson(m[1],false);return;}
  if(m=h.match(/^#work-(.+)$/)){showWork(m[1],false);return;}
  if(m=h.match(/^#role-(.+)$/)){showRole(m[1],false);return;}
  if(m=h.match(/^#venue-(.+)$/)){showVenue(m[1],false);return;}
  if(m=h.match(/^#troupe-(.+)$/)){showTroupe(m[1],false);return;}
  if(m=h.match(/^#project-(.+)$/)){goProject(m[1],false);return;}
  if(m=h.match(/^#mytroupe-(.+)$/)){goMyTroupe(m[1],false);return;}
  goHome(false);
}
window.addEventListener('popstate',function(){routeFromHash(location.hash);});

(async function(){
  await initAuth();
})();
